services:
  - type: web
    name: alert-dou-api
    runtime: python
    buildCommand: pip install -e . && playwright install chromium --with-deps
    startCommand: alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alert-dou-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: alert-dou-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: alert-dou-worker
    runtime: python
    buildCommand: pip install -e . && playwright install chromium --with-deps
    startCommand: celery -A workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alert-dou-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: alert-dou-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: redis
    name: alert-dou-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: alert-dou-db
    plan: free
    databaseName: alertdou
    user: alertdou
