[project]
name = "alert-dou"
version = "0.1.0"
description = "AI-powered monitoring system for the Brazilian Official Gazette (DOU)"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "beautifulsoup4>=4.13",
    "playwright>=1.51",
    "playwright-stealth>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
    "slowapi>=0.1.9",
    "schedule>=1.2.1",
    "curl-cffi>=0.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mkdocs-material>=9.5",
]
